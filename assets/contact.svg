<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Contact"><title>Contact</title><style>
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{opacity:0;animation:in 1.1s cubic-bezier(.2,.6,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.star{animation:star 18s ease-in-out infinite}
@keyframes star{0%,100%{opacity:.18}50%{opacity:.5}}
</style><rect width="1000" height="200" rx="20" fill="#000000"/><rect x=".5" y=".5" width="999" height="199" rx="20" fill="none" stroke="#2a2a2a"/><text x="40" y="50" font-size="22" fill="#ffffff" font-weight="600" text-anchor="start" letter-spacing="0" >Contact</text><text x="960" y="50" font-size="15" fill="#9a9fa5" font-weight="400" text-anchor="end" letter-spacing="0" >Replies within 24h</text><line x1="40" y1="72" x2="960" y2="72" stroke="#2a2a2a"/><g class="in" style="animation-delay:0.15s"><text x="40.0" y="116" font-size="14" fill="#9a9fa5" font-weight="400" text-anchor="start" letter-spacing="0" >Website</text><text x="150.0" y="116" font-size="17" fill="#ffffff" font-weight="500" text-anchor="start" letter-spacing="0" >umairiqbal.com</text></g><g class="in" style="animation-delay:0.23s"><text x="40.0" y="160" font-size="14" fill="#9a9fa5" font-weight="400" text-anchor="start" letter-spacing="0" >Email</text><text x="150.0" y="160" font-size="17" fill="#ffffff" font-weight="500" text-anchor="start" letter-spacing="0" >hello@umairiqbal.com</text></g><g class="in" style="animation-delay:0.31s"><text x="500.0" y="116" font-size="14" fill="#9a9fa5" font-weight="400" text-anchor="start" letter-spacing="0" >GitHub</text><text x="610.0" y="116" font-size="17" fill="#ffffff" font-weight="500" text-anchor="start" letter-spacing="0" >github.com/UmairIqbal92</text></g></svg>