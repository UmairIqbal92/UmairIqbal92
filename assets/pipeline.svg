<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Agent pipeline: Intent → Plan → Act → Verify → Ship">
  <title>Agent pipeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070b13"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="track" d="M90 75 H810"/>
    <path id="back" d="M810 75 C 850 75, 850 125, 810 125 H 90 C 50 125, 50 75, 90 75"/>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono","Fira Code",Menlo,Consolas,"Courier New",monospace; }
    .lbl { fill: #e2e8f0; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    .sub { fill: #64748b; font-size: 9.5px; }
    .box { animation: breathe 3s ease-in-out infinite; }
    .b2 { animation-delay: .6s } .b3 { animation-delay: 1.2s } .b4 { animation-delay: 1.8s } .b5 { animation-delay: 2.4s }
    @keyframes breathe { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
    .dash { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
  </style>
  <rect width="900" height="150" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="149" rx="14" fill="none" stroke="#1f2b3d"/>

  <text x="24" y="26" class="mono sub" letter-spacing="2">PIPELINE · autonomous loop</text>
  <text x="876" y="26" text-anchor="end" class="mono sub">cycle: <tspan fill="#34d399">running</tspan></text>

  <!-- wires -->
  <use href="#track" stroke="#1f2b3d" stroke-width="2" fill="none"/>
  <use href="#track" stroke="url(#wire)" stroke-width="2" fill="none" class="dash" opacity="0.8"/>
  <path d="M810 75 C 850 75, 850 125, 810 125 H 90 C 50 125, 50 75, 90 75" fill="none" stroke="#1f2b3d" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- packets -->
  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <circle r="4" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <circle r="4" fill="#34d399" filter="url(#glow)">
    <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <circle r="3" fill="#fbbf24" opacity="0.9">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#back"/></animateMotion>
  </circle>

  <!-- stages -->
  <g class="mono">
    <g class="box" transform="translate(90,75)">
      <rect x="-58" y="-22" width="116" height="44" rx="10" fill="#0b1020" stroke="#22d3ee" stroke-width="1.5"/>
      <text y="-2" text-anchor="middle" class="lbl">INTENT</text>
      <text y="13" text-anchor="middle" class="sub">goal · context</text>
    </g>
    <g class="box b2" transform="translate(270,75)">
      <rect x="-58" y="-22" width="116" height="44" rx="10" fill="#0b1020" stroke="#38bdf8" stroke-width="1.5"/>
      <text y="-2" text-anchor="middle" class="lbl">PLAN</text>
      <text y="13" text-anchor="middle" class="sub">decompose · route</text>
    </g>
    <g class="box b3" transform="translate(450,75)">
      <rect x="-58" y="-22" width="116" height="44" rx="10" fill="#0b1020" stroke="#a78bfa" stroke-width="1.5"/>
      <text y="-2" text-anchor="middle" class="lbl">ACT</text>
      <text y="13" text-anchor="middle" class="sub">tools · MCP · APIs</text>
    </g>
    <g class="box b4" transform="translate(630,75)">
      <rect x="-58" y="-22" width="116" height="44" rx="10" fill="#0b1020" stroke="#fbbf24" stroke-width="1.5"/>
      <text y="-2" text-anchor="middle" class="lbl">VERIFY</text>
      <text y="13" text-anchor="middle" class="sub">eval · guardrails</text>
    </g>
    <g class="box b5" transform="translate(810,75)">
      <rect x="-58" y="-22" width="116" height="44" rx="10" fill="#0b1020" stroke="#34d399" stroke-width="1.5"/>
      <text y="-2" text-anchor="middle" class="lbl">SHIP</text>
      <text y="13" text-anchor="middle" class="sub">deploy · observe</text>
    </g>
  </g>
  <text x="450" y="142" text-anchor="middle" class="mono sub">feedback loop ↺ memory · retries · human-in-the-loop</text>
</svg>
