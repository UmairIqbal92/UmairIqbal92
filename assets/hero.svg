cy="196" r="1.2" fill="#ffffff" class="star" style="animation-delay:-6s"/><circle cx="78" cy="185" r="1" fill="#ffffff" class="star" style="animation-delay:-13s"/><circle cx="250" cy="180" r="0.8" fill="#ffffff" class="star" style="animation-delay:-12s"/><circle cx="9" cy="13" r="0.8" fill="#ffffff" class="star" style="animation-delay:-11s"/>
