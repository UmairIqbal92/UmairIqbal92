.in{opacity:0;animation:in 1.1s cubic-bezier(.2,.6,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.star{animation:star 18s ease-in-out infinite}
@keyframes star{0%,100%{opacity:.18}50%{opacity:.5}}
</style><defs>
<radialGradient id="glow" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
</defs>
