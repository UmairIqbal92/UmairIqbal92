acing="0" >YOLO</text><text x="383.0" y="224" font-size="13" fill="#9a9fa5" font-weight="400" text-anchor="middle" letter-spacing="0" >Earned once</text></g><g class="in" style="animation-delay:0.35s"><rect x="508" y="92" width="218" height="162" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".14"/><circle cx="617.0" cy="140" r="30" fill="#101010" stroke="#2a2a2a"/><circle cx="617.0" cy="140" r="18" fill="none" stroke="#ffffff" stroke-width="2"/><circle cx="617.0" cy="140" r="6" fill="#ffffff"/><text x="617.0" y="202" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle" letter-spacing="0" >Quickdraw</text><text x="617.0" y="224" font-size="13" fill="#9a9fa5" font-weight="400" text-anchor="middle" letter-spacing="0" >Earned once</text></g><g class="in" style="animation-delay:0.45s"><rect x="742" y="92" width="218" height="162" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".14"/><circle cx="851.0" cy="140" r="30" fill="#101010" stroke="#2a2a2a"/><circle cx="851.0" cy="140" r="18" fill="none" stroke="#ffffff" stroke-width="2"/><circle cx="851.0" cy="140" r="6" fill="#ffffff"/><text x="851.0" y="202" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle" letter-spacing="0" >Starstruck</text><text x="851.0" y="224" font-size="13" fill="#9a9fa5" font-weight="400" text-anchor="middle" letter-spacing="0" >Earned once</text></g></svg>