<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="282" viewBox="0 0 1000 282" role="img" aria-label="Achievements"><title>Achievements</title><style>
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{opacity:0;animation:in 1.1s cubic-bezier(.2,.6,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.star{animation:star 18s ease-in-out infinite}
@keyframes star{0%,100%{opacity:.18}50%{opacity:.5}}
</style><rect width="1000" height="282" rx="20" fill="#000000"/><rect x=".5" y=".5" width="999" height="281" rx="20" fill="none" stroke="#2a2a2a"/><text x="40" y="50" font-size="22" fill="#ffffff" font-weight="600" text-anchor="start" letter-spacing="0" >Achievements</text><text x="960" y="50" font-size="15" fill="#9a9fa5" font-weight="400" text-anchor="end" letter-spacing="0" >Earned on GitHub</text><line x1="40" y1="72" x2="960" y2="72" stroke="#2a2a2a"/><defs>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
