<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="30" viewBox="0 0 1000 30" role="img" aria-label="divider"><title>divider</title><style>
.s{font-family:"Inter","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif}.m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,"Courier New",monospace}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fi{opacity:0;animation:fi 1s ease-out forwards}
@keyframes fi{to{opacity:1}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.35);opacity:.4}}
</style><defs>
<filter id="g6" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="g1" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.2"/></filter>
<linearGradient id="hline" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".6"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="vfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000"/></linearGradient>
</defs><rect width="1000" height="30" fill="#000000"/>
<line x1="0" y1="15" x2="1000" y2="15" stroke="#1a1a1a"/>
<rect x="-160" y="14" width="160" height="1" fill="url(#hline)"><animate attributeName="x" from="-160" to="1000" dur="5s" repeatCount="indefinite"/></rect>
<circle cx="500" cy="15" r="2" fill="#3a3f44"/></svg>