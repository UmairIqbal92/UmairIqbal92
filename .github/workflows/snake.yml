name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#0a0a0a,#2a2a2a,#555555,#9a9a9a,#ffffff
            dist/github-snake-light.svg?palette=github-light&color_snake=#000000
            dist/github-snake.gif?color_snake=#ffffff&color_dots=#0a0a0a,#2a2a2a,#555555,#9a9a9a,#ffffff

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
