name: Agent-OS Render

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/agent-os.yml"

permissions:
  contents: write

concurrency:
  group: agent-os-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render assets from live GitHub data
        env:
          # Optional: add a repo secret PROFILE_TOKEN (classic PAT, scopes: read:user, repo)
          # so private contribution counts are included. Falls back to the Actions token.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py --user "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          git config user.name "umair-1 autopilot"
          git config user.email "actions@github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "telemetry: refresh rendered assets [skip ci]"
            git push
          fi
